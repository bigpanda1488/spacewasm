name: CI

on:
  push:https://github.com/bigpanda1488/spacewasm/actions
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled to free runner capacity.
# Runs on main are queued instead, so every commit on main gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64 is disabled: GitHub's macOS runners are too flaky.
          # - os: macos-arm64
          #   runner: macos-15
          #   profile: debug
          # - os: macos-arm64
          #   runner: macos-15
          #   profile: release

          # Linux x86_64
          - os: linux-x86
            runner: ubuntu-latest
            profile: debug
          - os: linux-x86
            runner: ubuntu-latest
            profile: release

          # Linux ARM64
          - os: linux-arm64
            runner: ubuntu-24.04-arm
            profile: debug
          - os: linux-arm64
            runner: ubuntu-24.04-arm
            profile: release

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      - name: Install WABT (WebAssembly Binary Toolkit)
        uses: ./.github/actions/install-wabt

      - name: Cache Rust dependencies
        # Pinned commit resolved from the annotated Swatinem/rust-cache@v2 tag.
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: ${{ matrix.profile }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false

      - name: Run tests (debug)
        if: matrix.profile == 'debug'
        run: cargo test --workspace --verbose

      - name: Run tests (release)
        if: matrix.profile == 'release'
        run: cargo test --workspace --release --verbose

      - name: Run tests with strict-assertions (debug)
        if: matrix.profile == 'debug'
        run: cargo test --workspace --features strict-assertions --verbose

      - name: Run tests with strict-assertions (release)
        if: matrix.profile == 'release'
        run: cargo test --workspace --release --features strict-assertions --verbose

  test-32bit:
    name: Test (i686-unknown-linux-gnu, ${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - debug
          - release

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install 32-bit system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: i686-unknown-linux-gnu

      - name: Install WABT (WebAssembly Binary Toolkit)
        uses: ./.github/actions/install-wabt

      # Only the interpreter library is deployed to the 32-bit target, so the
      # host-only workspace tooling is not built here. Running the suite on a
      # 32-bit `usize` guards pointer-width regressions (e.g. memory
      # effective-address overflow) that the 64-bit test matrix cannot observe.
      - name: Run tests (debug)
        if: matrix.profile == 'debug'
        run: cargo test -p spacewasm --target i686-unknown-linux-gnu --verbose

      - name: Run tests (release)
        if: matrix.profile == 'release'
        run: cargo test -p spacewasm --release --target i686-unknown-linux-gnu --verbose

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        # Pinned to the commit the `stable` branch resolved to (its action.yml
        # defaults `toolchain: stable`); immutable ref for supply-chain safety.
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check C header codegen is up to date
        run: |
          # Regenerate include/spacewasm.h from the Rust source. The build
          # script writes the header in place when the `codegen` feature is on.
          cargo build -p spacewasm_c_api --features codegen
          # Fail if the regenerated header differs from what is tracked in git.
          if ! git diff --exit-code -- crates/spacewasm_c_api/include/spacewasm.h; then
            echo "::error::spacewasm.h is out of date. Run 'cargo build -p spacewasm_c_api --features codegen' and commit the result."
            exit 1
          fi

  # The fuzzing crates live in their own workspace under `fuzz/`, so the
  # root `--workspace` test/lint jobs above do not cover them.
  fuzz-check:
    name: Fuzz (lint & test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        # Pinned commit resolved from the annotated Swatinem/rust-cache@v2 tag.
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false

      - name: Check formatting
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check

      - name: Run clippy
        run: cargo clippy --manifest-path fuzz/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path fuzz/Cargo.toml -p spacewasm-fuzzing --verbose

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - validate
          - validate-differential
          - no-traps
          - malformed
          - exec-differential
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly-2026-08-30

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-fuzz

      # The prebuilt cargo-fuzz is a musl binary, and `cargo fuzz` defaults
      # `--target` to the triple it was built for. Sanitizers do not support
      # static musl, so build for the toolchain's host (as the Makefile does).
      - name: Select fuzz target triple
        run: |
          echo "SPACEWASM_TARGET=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_ENV"

      # Every fuzz target builds the same dependencies, so all of them (and
      # the nightly `fuzz-corpus` job) share one cache, saved by a single job.
      # A cache per target would add several near-identical entries to the
      # repository's 10 GB cache budget.
      - name: Cache Rust dependencies
        # Pinned commit resolved from the annotated Swatinem/rust-cache@v2 tag.
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: fuzz
          shared-key: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.target == 'validate' }}
          cache-bin: false

      - name: Build fuzzer
        run: cargo +nightly-2026-08-30 fuzz build ${{ matrix.target }} --target "$SPACEWASM_TARGET"

      # The corpus is seeded and kept minimized by the nightly `fuzz-corpus`
      # job (fuzz-corpus.yml). libFuzzer replays every corpus input through
      # the oracle before fuzzing, so this run re-checks all of the coverage
      # the corpus has reached, even when the replay outlasts the 30s budget.
      # A cache miss just means fuzzing from scratch.
      - name: Restore fuzzing corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Run fuzzer (30s)
        run: cargo +nightly-2026-08-30 fuzz run ${{ matrix.target }} --target "$SPACEWASM_TARGET" -- -max_total_time=30

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust dependencies
        # Pinned commit resolved from the annotated Swatinem/rust-cache@v2 tag.
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false

      - name: Build docs
        run: cargo doc --workspace --no-deps --all-features

      # `doc = false` keeps the `spacewasm` binary out of the workspace docs, where
      # its page would overwrite the `spacewasm` library's; check its docs on their own.
      - name: Build docs (spacewasm binary)
        run: cargo doc -p spacewasm_tools --bin spacewasm --no-deps

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is omitted: GitHub's macOS runners are too flaky.
          - os: linux-x86
            runner: ubuntu-latest
          - os: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Build all targets
        run: cargo build --workspace --all-targets --verbose

      - name: Build release
        run: cargo build --workspace --release --verbose

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: riscv32imc-unknown-none-elf,riscv64gc-unknown-none-elf,thumbv7m-none-eabi,thumbv7em-none-eabihf

      - name: Install QEMU
        uses: ./.github/actions/install-qemu

      - name: Install Cargo binutils
        run: |
          cargo install cargo-binutils
          rustup component add llvm-tools

      - name: Install and Setup Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13' 

      - name: Cache Rust dependencies
        # Pinned commit resolved from the annotated Swatinem/rust-cache@v2 tag.
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false

      - name: Run Benchmark
        id: benchmark
        run: |
          # Build and run the benchmark from workspace root, capturing output
          output=$(python3 .github/scripts/run_benchmark.py 4)
          echo "$output"
          echo "out<<EOF" >> $GITHUB_OUTPUT
          echo "$output" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload NM artifacts
        id: upload_nm_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nm-artifacts
          path: nm-artifact_*.txt

      - name: Run Baseline Benchmark
        id: baseline
        continue-on-error: true
        run: |
          # Try to get baseline from main branch
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git fetch origin main:main
            git checkout main
            output=$(python3 .github/scripts/run_benchmark.py 4) || true
            git checkout -

            if [ -n "$output" ]; then
              echo "out<<EOF" >> $GITHUB_OUTPUT
              echo "$output" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
              echo "$output"
            else
              echo "out={}" >> $GITHUB_OUTPUT
            fi
          else
            echo "out={}" >> $GITHUB_OUTPUT
          fi

      - name: Save benchmark results
        if: github.event_name == 'pull_request'
        # quotes intentionally ommitted around current and baseline values
        run: |
          cat > benchmark-results.json <<EOF
          {
            "prNumber": "${{ github.event.pull_request.number }}",
            "current": ${{ steps.benchmark.outputs.out }},
            "baseline": ${{ steps.baseline.outputs.out }},
            "nm_artifacts_url": "${{ steps.upload_nm_artifacts.outputs.artifact-url }}"
          }
          EOF

      - name: Upload benchmark results
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: benchmark-results.json

  model-checking:
    name: Formal Verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run Kani on repo
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          args: "-j --output-format=terse"

  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly-2026-08-30
          components: miri

      - name: Run Miri
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo miri test --lib --no-fail-fast --verbose --features miri-soft-floats

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: llvm-tools-preview

      - name: Install WABT (WebAssembly Binary Toolkit)
        uses: ./.github/actions/install-wabt

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-llvm-cov

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false

      - name: Generate coverage
        run: |
          # Cover the main library and the C-API layer. spacewasm_c_api's Rust
          # `#[cfg(test)]` suite drives the `spacewasm_*` entry points directly,
          # so its coverage is attributed like any other crate.
          cargo llvm-cov \
            --package spacewasm \
            --package spacewasm_c_api \
            --lcov --output-path lcov.info
          cargo llvm-cov \
            --package spacewasm \
            --package spacewasm_c_api \
            --json --output-path coverage.json

      - name: Extract coverage percentage
        id: coverage
        run: |
          # Extract coverage percentage from JSON output
          coverage=$(jq -r '.data[0].totals.lines.percent' coverage.json)
          echo "percentage=$coverage" >> $GITHUB_OUTPUT
          echo "Current coverage: $coverage%"

      - name: Download baseline coverage
        id: baseline-coverage
        continue-on-error: true
        run: |
          # Try to get baseline from main branch
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git fetch origin main:main
            git checkout main
            cargo llvm-cov \
              --package spacewasm \
              --package spacewasm_c_api \
              --json --output-path baseline-coverage.json 2>&1 || true
            git checkout -

            if [ -f baseline-coverage.json ]; then
              baseline=$(jq -r '.data[0].totals.lines.percent' baseline-coverage.json)
              echo "baseline=$baseline" >> $GITHUB_OUTPUT
              echo "Baseline coverage: $baseline%"
            else
              echo "baseline=" >> $GITHUB_OUTPUT
            fi
          else
            echo "baseline=" >> $GITHUB_OUTPUT
          fi

      - name: Save coverage results
        if: github.event_name == 'pull_request'
        run: |
          cat > coverage-results.json <<EOF
          {
            "prNumber": "${{ github.event.pull_request.number }}",
            "currentCoverage": "${{ steps.coverage.outputs.percentage }}",
            "baselineCoverage": "${{ steps.baseline-coverage.outputs.baseline }}"
          }
          EOF

      - name: Upload coverage results
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-results
          path: coverage-results.json

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
github.ref
name: PR Comments
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  pull-requests: write
  contents: read

jobs:
  comment:
    name: Post PR comments
    runs-on: ubuntu-latest
    # Only act on CI runs that were triggered by a pull request.
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download CI artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts
          # The benchmark/coverage artifacts may not both exist (e.g. one job
          # failed); tolerate missing ones instead of failing the whole run.
        continue-on-error: true

      - name: Post benchmark and coverage comments
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TRUSTED_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          script: |
            const fs = require('fs');

            const prNumber = parseInt(process.env.TRUSTED_PR_NUMBER, 10);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              console.log('No trusted PR number on the workflow_run event; skipping comments.');
              return;
            }

            // Reads an artifact JSON file if it was downloaded, else null.
            function readResults(name) {
                const path = `artifacts/${name}/${name}.json`;
                if (!fs.existsSync(path)) {
                    console.log(`No ${name} artifact found; skipping.`);
                    return null;
                }
                return JSON.parse(fs.readFileSync(path, 'utf8'));
            }

            // Parses an artifact-supplied numeric field. Returns null for any
            // value that is not a finite number so untrusted content can never
            // reach the comment body verbatim.
            function finiteOrNull(value) {
              const n = parseFloat(value);
              return Number.isFinite(n) ? n : null;
            }

            // Returns an artifact-supplied URL only if it is an https link to
            // GitHub, else null. Anything else (other schemes or hosts) could
            // point readers of a bot comment at an attacker-controlled page.
            function safeArtifactUrl(url) {
              try {
                const parsed = new URL(String(url));
                const allowed = ['github.com', 'githubusercontent.com'];
                if (parsed.protocol === 'https:' &&
                    allowed.some(h => parsed.hostname === h || parsed.hostname.endsWith('.' + h))) {
                  return parsed.href;
                }
              } catch (_) { /* not a URL */ }
              console.log('Rejected artifact URL: ' + JSON.stringify(url));
              return null;
            }

            // Makes an artifact-supplied string safe for a single-line
            // Markdown context (code span or table cell): drops backticks,
            // pipes and HTML brackets, folds newlines and bounds the length.
            function sanitizeMd(value, maxLen = 128) {
              return String(value ?? '')
                .replace(/[`|<>]/g, '')
                .replace(/[\r\n]+/g, ' ')
                .slice(0, maxLen);
            }

            // Makes an artifact-supplied string safe inside a fenced code
            // block. Newlines are kept; backticks are dropped so the fence
            // cannot be closed early.
            function sanitizeCode(value, maxLen = 8192) {
              return String(value ?? '').replace(/`/g, '').slice(0, maxLen);
            }

            // Creates a new comment or updates the existing bot comment that
            // contains `marker` in its body.
            async function upsertComment(prNumber, marker, body) {
                const { data: comments } = await github.rest.issues.listComments({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                });

                const botComment = comments.find(c =>
                    c.user.type === 'Bot' && c.body.includes(marker)
                );

                if (botComment) {
                await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: botComment.id,
                    body,
                });
                } else {
                await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body,
                });
                }
            }

            // Formats a number with thousands separators, wrapped in code.
            function fmt(value, digits = 0, unit = "") {
                const s = value.toLocaleString('en-US', {
                    minimumFractionDigits: digits,
                    maximumFractionDigits: digits,
                });
                return "`" + s + "`" + unit;
            }

            // Returns the "base" and "Delta" cells comparing `value` against
            // `old`. A missing baseline is reported as a new entry.
            function compare(value, old, digits = 0, unit = "") {
                if (old === undefined || old === null) {
                    return ["—", "new"];
                }
                const base = fmt(old, digits, unit);
                const diff = value - old;
                if (diff.toFixed(digits) == 0) {
                    return [base, "no change"];
                }
                const sign = diff > 0 ? "+" : "−";
                let delta = sign + fmt(Math.abs(diff), digits, unit);
                if (old != 0) {
                    delta += " (" + sign + Math.abs(100 * diff / old).toFixed(1) + "%)";
                }
                return [base, delta];
            }

            // A single summary cell: the value followed by its absolute and
            // percentage change against `old`, if there is one.
            function summarize(value, old) {
                let cell = fmt(value, 0, " B");
                if (old === null || old == value) {
                    return cell;
                }
                const diff = value - old;
                const sign = diff > 0 ? "+" : "−";
                cell += " " + sign + fmt(Math.abs(diff), 0, " B");
                if (old != 0) {
                    cell += " (" + sign + Math.abs(100 * diff / old).toFixed(1) + "%)";
                }
                return cell;
            }

            // Sums the named sections, or null if any of them is missing.
            function total(sizes, names) {
                let sum = 0;
                for (let name of names) {
                    const n = finiteOrNull((sizes ?? {})[name]);
                    if (n === null) {
                        return null;
                    }
                    sum += n;
                }
                return sum;
            }

            const benchmark = readResults('benchmark-results');
            if (benchmark) {
                const data = benchmark.current;
                const old_data = benchmark.baseline;
                const nm_url = safeArtifactUrl(benchmark.nm_artifacts_url);

                let triples = benchmark.current.triples;
                let elf_sections = benchmark.current.elf_sections;

                // .data is stored in flash and copied into RAM at startup, so
                // it counts towards both.
                const flash_sections = [".text", ".rodata", ".data"];
                const ram_sections = [".data", ".bss"];

                const size_marker = "<!-- spacewasm-size-report -->";
                let comment = size_marker + "\n## Size Summary\n\n";
                comment += "| Target | Flash | RAM (static) | Heap |\n";
                comment += "| :-- | --: | --: | --: |\n";
                for (let triple of triples) {
                    const old = old_data[triple];
                    const heap = finiteOrNull(data[triple]["heap"]);
                    comment += "| **`"+sanitizeMd(triple)+"`** | "
                        + summarize(total(data[triple], flash_sections), total(old, flash_sections)) + " | "
                        + summarize(total(data[triple], ram_sections), total(old, ram_sections)) + " | "
                        + (heap === null ? "-" : summarize(heap, finiteOrNull((old ?? {})["heap"]))) + " |\n";
                }
                comment += "\n_Flash: `.text` + `.rodata` + `.data`. RAM: `.data` + `.bss`. Heap: bytes allocated from the SpaceWasm global allocator after running coremark. The embedded wasm module and its linear memory are excluded._\n";

                comment += "\n<details><summary><i>view per-section sizes...</i></summary>\n\n";
                comment += "| Target | Section | This PR | base | Delta |\n";
                comment += "| :-- | :-- | --: | --: | --: |\n";
                for (let triple of triples) {
                    elf_sections.forEach((section_name, i) => {
                        let size = finiteOrNull(data[triple][section_name]);
                        let old_size = finiteOrNull((old_data[triple] ?? {})[section_name]);
                        let target = i == 0 ? "**`"+sanitizeMd(triple)+"`**" : "";
                        if (size === null) {
                            comment += "| "+target+" | `"+sanitizeMd(section_name)+"` | - | - | - |\n";
                            return;
                        }
                        let [base, delta] = compare(size, old_size, 0, " B");
                        comment += "| "+target+" | `"+sanitizeMd(section_name)+"` | "+fmt(size, 0, " B")+" | "+base+" | "+delta+" |\n";
                    });

                    // Bytes handed out by the global allocator after running
                    // coremark. Wasm linear memory is not included.
                    let heap = finiteOrNull(data[triple]["heap"]);
                    if (heap !== null) {
                        let old_heap = finiteOrNull((old_data[triple] ?? {})["heap"]);
                        let [base, delta] = compare(heap, old_heap, 0, " B");
                        comment += "| | heap | "+fmt(heap, 0, " B")+" | "+base+" | "+delta+" |\n";
                    }
                }
                comment += "\n</details>\n";
                comment += "\n<details><summary><i>view ELF section headers and symbol table...</i></summary>\n\n";
                if (nm_url !== null) {
                    comment += "<br><small>You can also download the <a href='"+nm_url+"'>full symbol tables</a>.</small>\n\n";
                }
                for (let triple of triples) {
                    comment += "### `"+sanitizeMd(triple)+"`\n";
                    comment += "```\n"+sanitizeCode(data[triple]["details"])+"\n";
                    comment += "\nSymbol Table:\n";
                    for (let symbol of (data[triple]["nm"] ?? []).slice(0, 64)) {
                      comment += "\t" + sanitizeCode(symbol, 256).replace(/[\r\n]+/g, ' ') + "\n";
                    }
                    comment += "\t...truncated (see artifact for full table)...\n```\n";
                }
                comment += "</details>\n";

                await upsertComment(prNumber, size_marker, comment);

                // The coremark comment keeps matching on its heading so the
                // combined comment posted before this split is reused.
                comment = "## Coremark Scores\n\n";
                comment += "| Target | QEMU CPU / Board | This PR | base | Delta | Host Time |\n";
                comment += "| :-- | :-- | --: | --: | --: | --: |\n";
                for (let triple of triples) {
                    let score = finiteOrNull(data[triple]["coremark"]);
                    let t = finiteOrNull(data[triple]["coremark_time"]);
                    if (score === null || t === null) {
                        comment += "| **`"+sanitizeMd(triple)+"`** | "+sanitizeMd(data[triple]["qemu_info"])+" | ❌ failed | - | - | - |\n";
                        continue;
                    }
                    let old_score = finiteOrNull((old_data[triple] ?? {})["coremark"]);
                    let [base, delta] = compare(score, old_score, 2);
                    comment += "| **`"+sanitizeMd(triple)+"`** | "+sanitizeMd(data[triple]["qemu_info"])+" | "+fmt(score, 2)+" | "+base+" | "+delta+" | "+t.toFixed(2)+" s |\n";
                }

                await upsertComment(prNumber, 'Coremark Scores', comment);
            }

            const coverage = readResults('coverage-results');
            if (coverage) {
              const currentCoverage = finiteOrNull(coverage.currentCoverage);
              const baselineCoverage = finiteOrNull(coverage.baselineCoverage);

              if (currentCoverage === null) {
                console.log('Coverage artifact has no valid currentCoverage; skipping.');
              } else {
                let comment = '## Code Coverage Report\n\n';
                comment += `**Current Coverage:** ${currentCoverage.toFixed(2)}%\n`;

                if (baselineCoverage !== null) {
                  const diff = currentCoverage - baselineCoverage;

                  comment += `**Baseline Coverage (main):** ${baselineCoverage.toFixed(2)}%\n`;
                  comment += `**Difference:** ${diff >= 0 ? '+' : ''}${diff.toFixed(2)}%\n\n`;

                  if (diff < -1.0) {
                    comment += '**Warning:** Coverage decreased by more than 1%\n';
                  } else if (diff >= 1.0) {
                    comment += '**Improvement:** Coverage increased!\n';
                  }
                } else {
                  comment += '\n_No baseline available for comparison_\n';
                }

                await upsertComment(
                  prNumber,
                  'Code Coverage Report',
                  comment
                );
              }
            }

